name: Android CI (Build Check)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 실행 권한 주고 바로 빌드
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 빌드 결과물(APK) 무조건 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soundmark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk